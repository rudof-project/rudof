[package]
name = 'shacl'
version.workspace = true
readme = "README.md"
authors.workspace = true
description = "A SHACL validator for RDF data, implemented in Rust."
documentation = "https://docs.rs/shacl"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["sparql"]
sparql = ["dep:sparql_service", "sparql_service/sparql", "rudof_rdf/sparql"]

[dependencies]
anyhow.workspace = true
dashmap.workspace = true
either.workspace = true
indoc.workspace = true
itertools.workspace = true
petgraph.workspace = true
prefixmap.workspace = true
rayon.workspace = true
rudof_rdf.workspace = true
rudof_config.workspace = true
rudof_iri.workspace = true
rudof_typing.workspace = true
rust_decimal.workspace = true
serde.workspace = true
sparql_service = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
oxrdf = { workspace = true, features = ["oxsdatatypes"] }

[[example]]
name = "endpoint_validation"
required-features = ["sparql"]

[[test]]
name = "shacl_testsuite"
required-features = ["sparql"]
