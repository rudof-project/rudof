[package]
name = "pgschema"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Prototype for PG-SChema with property constraints"
repository = "https://github.com/wesopapers/pgschemapc"
keywords = ["pgschema", "property-graphs", "property-constraints"]
categories = [
    "command-line-utilities",
    "web-programming",
    "parser-implementations",
    "data-structures",
]

[dependencies]
colored.workspace = true
csv.workspace = true
either.workspace = true
itertools.workspace = true
regex.workspace = true
rustemo.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true

# Only used by the command line interface (`cli` module)
[target.'cfg(not(target_family = "wasm"))'.dependencies]
clap.workspace = true

[dev-dependencies]
tracing-test.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
rustemo-compiler.workspace = true

[build-dependencies]
rustemo-compiler.workspace = true

[lints]
workspace = true
