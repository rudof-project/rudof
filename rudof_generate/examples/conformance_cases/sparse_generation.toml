# Sparse case: same supported ShEx schema, but generation is intentionally less dense.
# Expected: lower data density in the generated graph.
version = 2

[run]
seed = 20260421
threads = 2
scale = { entities = 20 }

[defaults]
cardinality = "min"
fill = 0.35

[output]
dir = "target/conformance_cases/sparse_generation"
