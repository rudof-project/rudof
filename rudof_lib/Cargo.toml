[package]
name = "rudof_lib"
version.workspace = true
authors.workspace = true
description.workspace = true
documentation = "https://docs.rs/rudof_lib"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
include = [
    "src/**/*.rs",
    "src/default_config.toml",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[features]
default = [ "sparql", "comparison", "conversion", "dctap", "pg-db", "pgschema", "rdf-config" ]
# Optional subsystems, which can be left out to make smaller builds (e.g. for
# wasm). RDF data, ShEx, SHACL and SPARQL are always available.
# Comparison of schemas.
comparison = ["dep:shapes_comparator"]
# Conversion of schemas (ShEx to UML, SHACL to ShEx, ...), and UML/image
# output of ShEx schemas.
conversion = ["dep:shapes_converter"]
# DCTAP profiles.
dctap = ["dep:dctap"]
# Embedded property graph database (lbug, a C++ library; native only).
pg-db = ["dep:lbug"]
# Property graph schemas and property graph data.
pgschema = ["dep:pgschema"]
# rdf-config documents.
rdf-config = ["dep:rdf_config"]
# Pull in the QLever Docker backend (sparql_service/qlever + rudof_rdf/qlever).
qlever = ["sparql_service/qlever", "rudof_rdf/qlever", "dep:tokio"]
sparql = [ "shacl/sparql", "sparql_service/sparql", "rudof_rdf/sparql" ]

[dependencies]
tokio = { workspace = true, optional = true }
rudof_config.workspace = true
colored.workspace = true
dctap = { workspace = true, optional = true }
either.workspace = true
oxrdf = { workspace = true, features = ["oxsdatatypes"] }
rudof_iri.workspace = true
prefixmap.workspace = true
pgschema = { workspace = true, optional = true }
rdf_config = { workspace = true, optional = true }
# On wasm only the header types are used: requests go through `utils::wasm_stubs`.
reqwest.workspace = true
regex.workspace = true
rudof_rdf.workspace = true
rudof_viz.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
shacl.workspace = true
shapes_comparator = { workspace = true, optional = true }
shapes_converter = { workspace = true, optional = true }
shex_ast.workspace = true
shex_validation.workspace = true
sparql_service.workspace = true
tabled.workspace = true
tracing.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossterm.workspace = true
lbug = { workspace = true, optional = true }
rudof_generate.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
