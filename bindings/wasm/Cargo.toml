[package]
name = "rudof_wasm"
version.workspace = true
authors.workspace = true
description = "WebAssembly bindings for rudof: ShEx and SHACL validation of RDF data"
documentation = "https://rudof-project.github.io/rudof/"
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["rdf", "shex", "shacl", "wasm", "validation"]
publish = false

[lib]
name = "rudof_wasm"
# "cdylib" is the `.wasm` module consumed by `wasm-bindgen`; "rlib" lets the
# integration tests (and native builds) link against the Rust API.
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = ["comparison", "conversion", "dctap", "pgschema", "rdf-config"]
# Optional parts of the API, each backed by the rudof_lib feature of the same
# name. Leaving them out makes the `.wasm` smaller: RDF data, ShEx, SHACL and
# SPARQL are always available.
comparison = ["rudof_lib/comparison"]
conversion = ["rudof_lib/conversion"]
dctap = ["rudof_lib/dctap"]
pgschema = ["rudof_lib/pgschema"]
rdf-config = ["rudof_lib/rdf-config"]
# Remote SPARQL endpoints (validation and queries against them), through
# JavaScript's `fetch`. Waiting for the responses relies on JSPI (WebAssembly
# JavaScript Promise Integration), so a module built with this feature only
# loads in runtimes with JSPI and exnref (e.g. Chrome 137+, Node.js 25+).
# Not a default feature for that reason.
endpoints = ["rudof_lib/jspi", "dep:rudof_rdf", "rudof_rdf/jspi"]

[dependencies]
# A path dependency, because workspace inheritance can't switch off default
# features.
rudof_lib = { path = "../../rudof_lib", default-features = false, features = ["sparql"] }
rudof_rdf = { path = "../../rudof_rdf", default-features = false, optional = true }
serde.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "0.3"
