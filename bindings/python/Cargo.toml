[package]
name = "pyrudof"
version.workspace = true
publish = false
edition = "2024"
description = "Python bindings for rudof"
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = [
    "Jose Emilio Labra Gayo <labra@uniovi.es>",
    "Samuel Bustamante Larriet <bustamantesamuel@uniovi.es>",
    "Álvaro García Fernández <garciafalvaro@uniovi.es>",
    "Ángel Iglesias Préstamo <angel.iglesias.prestamo@gmail.com>",
    "Marc-Antoine Arnaud <marc-antoine.arnaud@luminvent.com>"
]
repository = "https://github.com/rudof-project/rudof"
homepage = "https://rudof-project.github.io/rudof"
documentation = "https://rudof-project.github.io/rudof/"
keywords = ["semantic-web", "knowledge-graphs", "data-models", "python"]

[features]
default = []
stub-gen = ["pyo3-stub-gen"]

[[bin]]
name = "stub_gen"
required-features = ["stub-gen"]

[lib]
name = "pyrudof"
crate-type = ["cdylib", "rlib"]
doctest = false

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310", "multiple-pymethods"]}
pythonize = { version = "0.29"}
rudof_lib = { workspace = true }
rudof_generate = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
pyo3-stub-gen = { version = "0.23", optional = true }
# Not optional: `remove_gen_stub` must strip `#[gen_stub(...)]` when stub-gen is off.
pyo3-stub-gen-derive = { version = "0.23" }