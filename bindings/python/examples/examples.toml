# Examples manifest for pyrudof documentation and testing.
#
# This file is the single source of truth for documented examples. Both
# bindings/python/docs/generate_examples_doc.py and bindings/python/tests/test_examples.py
# read it through examples/_registry.py.
#
# `expected_output` holds substrings that must appear in the example's stdout.

[categories.rdf]
title = "RDF Data Handling"
description = """Examples for RDF loading, serialization, and node inspection."""

[categories.sparql]
title = "SPARQL Queries"
description = """Examples for SELECT, CONSTRUCT and ASK query workflows."""

[categories.shex]
title = "ShEx Validation"
description = """Examples for reading ShEx schemas, validating data, and serializing schemas/ShapeMaps."""

[categories.shacl]
title = "SHACL Validation"
description = """Examples for SHACL loading, validation, extraction from data, and serialization."""

[categories.dctap]
title = "DCTAP"
description = """Examples for reading DCTAP profiles from inline content or files."""

[categories.pgschema]
title = "PG Schema Validation"
description = """Examples for reading Property Graph schemas, loading typemaps, and validating PG data."""

[categories.pg_db]
title = "Property Graph Database (LadybugDB)"
description = """Examples for deriving DDL from RDF data, and connecting to, loading, and querying a LadybugDB property graph database."""

[categories.materialize]
title = "Materialize"
description = """Examples for materializing RDF graphs from ShEx schemas with Map semantic actions."""

[categories.prefixes]
title = "Prefix Management"
description = """Examples for managing the default prefix map (add, rename, copy, remove)."""

[categories.rdf_config]
title = "RDF-config"
description = """Examples for reading and serializing RDF-config YAML specifications."""

[categories.endpoint]
title = "Service Description"
description = """Examples for service description parsing and serialization."""

[categories.generate]
title = "Data Generation"
description = """Examples for GeneratorConfig and DataGenerator APIs."""

[categories.utility]
title = "Utility & Introspection"
description = """Examples for config loading, resets, versioning, error handling, and module introspection."""

[category_order]
order = ["rdf", "prefixes", "sparql", "shex", "materialize", "shacl", "pgschema", "pg_db", "dctap", "rdf_config", "endpoint", "generate", "utility"]

[[example]]
key = "shex_validate_inline"
source_file = "shex/shex_validate_inline.py"
title = "ShEx Validate Inline"
description = "Validate inline RDF data against an inline ShEx schema and ShapeMap"
category = "shex"
files = {}
expected_output = [
    "conforms: True",
    "entries: 1",
    "http://example.org/alice @ http://example.org/Person: conformant",
]

[[example]]
key = "shex_validate_file"
source_file = "shex/shex_validate_file.py"
title = "ShEx Validate Files"
description = "Validate RDF data from files against a ShEx schema and ShapeMap"
category = "shex"
files = { schema = "person.shex", data = "person.ttl", shapemap = "person.sm" }
expected_output = [
    "conforms: True",
    "violations: 0",
    "http://example.org/alice @ http://example.org/Person: conformant",
]

[[example]]
key = "shex_serialize"
source_file = "shex/shex_serialize.py"
title = "ShEx Serialize"
description = "Serialize the currently loaded ShEx schema"
category = "shex"
files = { schema = "person.shex" }
expected_output = [
    ":Person",
    ":name xsd:string",
    "ShExJ length: True",
]

