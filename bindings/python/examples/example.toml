[rdf.endpoints.dbpedia]
query_url = "http://dbpedia.org/sparql"

[rdf.endpoints.dbpedia.prefixmap]
dbc = "http://dbpedia.org/class/"
dbo = "http://dbpedia.org/ontology/"
