# Label taxonomy for rudof — single source of truth.
#
# Documented in docs/src/contributing/labels.md; keep both in sync.
# `from` records the previous name of a renamed label, so applying this file
# preserves the label's existing assignments.
#
# Namespaces and their colours:
#   area/      0e8a16  what part of rudof is affected (at least one per issue)
#   platform/  1d76db  binding, OS or packaging target
#   spec/      5319e7  specification version cutting across areas
#   status/    fbca04  where the issue is in its lifecycle (at most one)
#   priority/  reds    how urgent it is (at most one)
# `help wanted` and `good first issue` stay unprefixed: GitHub matches those
# exact names in its contributor discovery pages.

