# --- status -------------------------------------------------------------

- name: "status/needs-triage"
  color: "fbca04"
  description: "Not yet reviewed by a maintainer"

- name: "status/needs-info"
  color: "fbca04"
  description: "Waiting for more information from the reporter"

- name: "status/blocked"
  color: "fbca04"
  description: "Cannot progress until something else is resolved"

- name: "status/pending-release"
  color: "fbca04"
  description: "Merged into master, waiting to be published in a release"

- name: "status/duplicate"
  color: "fbca04"
  description: "Already tracked by another issue or pull request"
  from: "duplicate"

- name: "status/invalid"
  color: "fbca04"
  description: "Not an actionable report"
  from: "invalid"

- name: "status/wontfix"
  color: "fbca04"
  description: "Deliberately not going to be worked on"
  from: "wontfix"

# --- priority -----------------------------------------------------------

- name: "priority/p0-critical"
  color: "b60205"
  description: "Data loss, security issue or master is broken — drop everything"

- name: "priority/p1-high"
  color: "d93f0b"
  description: "Blocks users with no workaround — next release"

- name: "priority/p2-medium"
  color: "e99695"
  description: "Should be done, has a workaround — scheduled when there is room"

- name: "priority/p3-low"
  color: "f9d0c4"
  description: "Nice to have — no committed timeframe"

# --- community ----------------------------------------------------------

- name: "help wanted"
  color: "008672"
  description: "We need help from external people"

- name: "good first issue"
  color: "7057ff"
  description: "Self-contained and well specified — a good entry point"
