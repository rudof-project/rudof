name: Board probe

# Temporary: checks whether the app token can still read the board now that it is private.
# Delete once the answer is known.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RUDOF_BOT_ID }}
          private-key: ${{ secrets.RUDOF_BOT_PK }}
          permission-issues: write
          permission-organization-projects: write

      - name: Read the project as the app
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api graphql -f query='
          query {
            organization(login: "rudof-project") {
              projectV2(number: 3) {
                title
                public
                items(first: 1) { totalCount }
                field(name: "Status") {
                  ... on ProjectV2SingleSelectField { options { name } }
                }
              }
            }
          }'
