name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - ".github/**"
      - "**/LICENSE*"
      - "**/README*"
      - "**/CHANGELOG*"
      - "**/.dockerignore"
      - "**/Dockerfile*"
      - "**/*.md"
      - "**/*.nix"
      - .readthedocs.yml
  pull_request:
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - ".github/**"
      - "**/LICENSE*"
      - "**/README*"
      - "**/CHANGELOG*"
      - "**/.dockerignore"
      - "**/Dockerfile*"
      - "**/*.md"
      - "**/*.nix"
      - .readthedocs.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --workspace
      # rudof_lib without its optional subsystems (see its Cargo features)
      - name: Run cargo check on rudof_lib without optional features
        run: cargo check -p rudof_lib --all-targets --no-default-features --features sparql
      - name: Run cargo check on rudof_lib with oxigraph's HTTP client
        run: cargo check -p rudof_lib --all-targets --features http-client

  # lbug (LadybugDB, the `pg-db` feature of rudof_lib) is a C++ library whose
  # build and link needs change between its releases. The jobs below build and
  # link `rudof` on the platforms where it broke before (MSVC and the manylinux
  # container of the Python wheels), so that a change is seen in the pull
  # request and not at release time. `cargo check` is not enough: it does not
  # link, and errors such as a missing `-latomic` only show at link time.
  pg-db-windows:
    name: Build with lbug (Windows MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      # Same as the windows job of artifacts.yml: lbug links `ssl.lib` and
      # `crypto.lib`, but the pre-installed OpenSSL names them `libssl.lib` and
      # `libcrypto.lib`.
      - name: Install OpenSSL
        run: |
          $opensslLibDir = "C:\Program Files\OpenSSL\lib"
          $shimDir = "$env:RUNNER_TEMP\openssl-lib-shim"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          foreach ($name in "ssl", "crypto") {
              $match = Get-ChildItem $opensslLibDir -Recurse -Filter "*$name.lib" | Select-Object -First 1
              if (-not $match) { throw "No $name.lib (or lib$name.lib) found under $opensslLibDir" }
              # lbug 0.19 links `ssl.lib`/`crypto.lib` and 0.20 or later
              # `libssl.lib`/`libcrypto.lib`: give both names.
              Copy-Item $match.FullName "$shimDir\$name.lib" -Force
              Copy-Item $match.FullName "$shimDir\lib$name.lib" -Force
          }
          echo "LIB=$shimDir;$env:LIB" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:/Program Files/OpenSSL/lib" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=C:/Program Files/OpenSSL/" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/Program Files/OpenSSL/include" >> $env:GITHUB_ENV
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Remove the MSYS2 libraries and utilities
        run: Remove-Item -LiteralPath "C:\msys64\" -Force -Recurse
      - name: Build rudof with lbug
        run: cargo build -p rudof_cli

  pg-db-manylinux:
    name: Build with lbug (manylinux_2_34)
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_34_x86_64
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      # Same packages and compiler as the before-script-linux of python.yml.
      # The build runs in this step because `gcc-toolset-13/enable` only
      # changes the environment of this shell.
      - name: Build rudof with lbug
        shell: bash
        run: |
          set -euxo pipefail
          yum install -y perl-core openssl openssl-devel pkgconfig libatomic
          if yum install -y gcc-toolset-13 2>/dev/null; then
              set +u
              source /opt/rh/gcc-toolset-13/enable
              set -u
              export CC=gcc
              export CXX=g++
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          source "$HOME/.cargo/env"
          cargo build -p rudof_cli

  check-wasm:
    name: Check wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run cargo check
        run: cargo check --workspace --target wasm32-unknown-unknown
      # Feature unification turns `shacl/sparql` on in the workspace check above,
      # so check the configurations used by the wasm bindings separately.
      - name: Run cargo check on shacl without sparql
        run: cargo check -p shacl --no-default-features --target wasm32-unknown-unknown
      - name: Run cargo check on the wasm bindings
        run: cargo check -p rudof_wasm --all-targets --target wasm32-unknown-unknown
      - name: Run cargo check on the wasm bindings without optional features
        run: cargo check -p rudof_wasm --all-targets --target wasm32-unknown-unknown --no-default-features
      - name: Run cargo check on the wasm bindings with remote SPARQL endpoints
        run: cargo check -p rudof_wasm --all-targets --target wasm32-unknown-unknown --features endpoints

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy check
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Run cargo test
        # pyrudof has no Rust tests, and linking its (empty) test binary needs
        # libpython, which the runner doesn't have. Its Python tests run in the
        # Python workflow, against the built wheels.
        run: cargo test --workspace --exclude pyrudof --features qlever
      # Feature unification turns `http-client` on in the workspace run above
      # (the CLI asks for it), so test SERVICE without it separately.
      - name: Run the SERVICE tests without oxigraph's HTTP client
        run: cargo test -p rudof_rdf --lib service_tests

  wasm-test:
    name: Test Suite on Wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        # The CLI version must match the `wasm-bindgen` crate in Cargo.lock
        run: cargo install wasm-bindgen-cli --locked --version "$(sed -n '/^name = "wasm-bindgen"$/{n;s/version = "\(.*\)"/\1/p}' Cargo.lock)"
      - name: Run cargo test
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --workspace --target wasm32-unknown-unknown --lib --tests

  wasm-bindings:
    name: Wasm bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli
        # The CLI version must match the `wasm-bindgen` crate in Cargo.lock
        run: cargo install wasm-bindgen-cli --locked --version "$(sed -n '/^name = "wasm-bindgen"$/{n;s/version = "\(.*\)"/\1/p}' Cargo.lock)"
      - name: Run the validation tests on wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p rudof_wasm --target wasm32-unknown-unknown
      - name: Run the validation tests on wasm without optional features
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test -p rudof_wasm --target wasm32-unknown-unknown --no-default-features
      - name: Build the npm package
        run: bindings/wasm/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the Node.js example
        run: node bindings/wasm/examples/node.cjs
      - name: Install and test the packed npm package
        run: bindings/wasm/npm/smoke-test.sh
      # Remote SPARQL endpoints (the endpoints/ build of the package) rely on
      # JSPI, which needs Node.js 25+.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Test remote SPARQL endpoints
        run: node bindings/wasm/tests/endpoints.cjs
      - name: Install and test the packed npm package with JSPI
        run: bindings/wasm/npm/smoke-test.sh
