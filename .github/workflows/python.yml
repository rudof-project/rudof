name: Python

on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "**/LICENSE*"
      - "**/README*"
      - "**/CHANGELOG*"
      - "**/.dockerignore"
      - "**/Dockerfile*"
      - "**/*.md"
      - "**/*.nix"
      - .readthedocs.yml
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "**/LICENSE*"
      - "**/README*"
      - "**/CHANGELOG*"
      - "**/.dockerignore"
      - "**/Dockerfile*"
      - "**/*.md"
      - "**/*.nix"
      - .readthedocs.yml
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  python-checks:
    name: Lint, types and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install pyrudof with its dev extras
        run: python3 -m pip install -e ".[dev]"
        working-directory: bindings/python
      - name: mypy
        run: python3 -m mypy
        working-directory: bindings/python
      - name: sphinx-lint
        run: sphinx-lint docs/
        working-directory: bindings/python
      - name: Docs build cleanly
        run: python3 -m sphinx -W -b html docs docs/_build/html
        working-directory: bindings/python
      - name: examples.rst is in sync with examples.toml
        run: python3 docs/generate_examples_doc.py --check
        working-directory: bindings/python
      - name: The generated stub is in sync with the Rust surface
        run: |
          cargo run --bin stub_gen --features stub-gen
          git diff --exit-code -- python/pyrudof/_pyrudof/__init__.pyi
        working-directory: bindings/python

  linux:
    runs-on: ${{ matrix.vm }}
    strategy:
      fail-fast: false
      matrix:
        target: [ x86_64, aarch64 ]
        include:
          - target: x86_64
            vm: ubuntu-latest
          - target: aarch64
            vm: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: "2_34"
          args: --release --out dist
          sccache: 'true'
          before-script-linux: |
            # If we're running on rhel/almalinux (manylinux containers), install needed packages.
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic

                # If we're running on i686 we need to symlink libatomic
                # in order to build openssl with -latomic flag.
                if [[ ! -d "/usr/lib64" ]]; then
                    ln -s /usr/lib/libatomic.so.1 /usr/lib/libatomic.so
                fi

                # lbug (LadybugDB) needs a C++23 <format>-capable compiler
                # (GCC 13+) to build its cxx FFI bridge; manylinux_2_34's
                # default GCC (11) is older, so pull in gcc-toolset-13 for
                # this build only. Best-effort: if the package isn't
                # available, fall through to the container's default compiler.
                if yum install -y gcc-toolset-13 2>/dev/null; then
                    source /opt/rh/gcc-toolset-13/enable
                    export CC=gcc
                    export CXX=g++
                fi
            else
                # If we're running on debian-based system.
                apt update -y && apt-get install -y --fix-missing libssl-dev openssl pkg-config
            fi
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: bindings/python/dist
      - name: Install Built Wheel
        run: python3 -m pip install -vv pyrudof --find-links=bindings/python/dist --no-index
      - name: Test Built Wheel
        run: |
          python3 -m pip install "pytest~=8.0"
          python3 -m pytest
        working-directory: bindings/python

  windows:
    runs-on: Windows-2022
    strategy:
      fail-fast: false
      matrix:
        target: [ x64 ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Point Cargo at the pre-installed OpenSSL
        run: |
          $opensslLibDir = "C:\Program Files\OpenSSL\lib"
          Get-Command openssl
          openssl version
          Get-ChildItem $opensslLibDir -Recurse -Filter *.lib

          $shimDir = "$env:RUNNER_TEMP\openssl-lib-shim"
          New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
          foreach ($name in "ssl", "crypto") {
              $match = Get-ChildItem $opensslLibDir -Recurse -Filter "*$name.lib" | Select-Object -First 1
              if (-not $match) { throw "No $name.lib (or lib$name.lib) found under $opensslLibDir" }
              Copy-Item $match.FullName "$shimDir\$name.lib" -Force
          }

          echo "LIB=$shimDir;$env:LIB" >> $env:GITHUB_ENV
          echo "OPENSSL_LIB_DIR=C:/Program Files/OpenSSL/lib" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=C:/Program Files/OpenSSL/" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/Program Files/OpenSSL/include" >> $env:GITHUB_ENV

          # The above fixes linking; pyrudof.pyd still needs the actual
          # libssl-3-x64.dll/libcrypto-3-x64.dll at import time. This PATH
          # entry doesn't help Python find them itself -- since Python 3.8,
          # extension-module DLL loading no longer searches PATH at all
          # (only system dirs, the .pyd's own directory, and dirs added via
          # os.add_dll_directory()). It's here so delvewheel (below), which
          # runs as an ordinary process and does still use PATH, can find
          # them to vendor into the wheel.
          echo "C:\Program Files\OpenSSL\bin" >> $env:GITHUB_PATH
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
      - name: Repair wheel with delvewheel (vendor OpenSSL DLLs)
        run: |
          python3 -m pip install delvewheel
          $wheel = Get-ChildItem bindings/python/dist/*.whl | Select-Object -First 1
          python3 -m delvewheel repair --add-path "C:\Program Files\OpenSSL\bin" -w bindings/python/dist-repaired $wheel.FullName
          Remove-Item $wheel.FullName
          Move-Item bindings/python/dist-repaired\*.whl bindings/python/dist\
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: bindings/python/dist
      - name: Install Built Wheel
        run: python3 -m pip install -vv pyrudof --find-links=bindings/python/dist --no-index
      - name: List pyrudof.pyd's DLL dependencies
        run: |
          $sitePkg = python3 -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $pyd = Get-ChildItem "$sitePkg\pyrudof" -Filter *.pyd | Select-Object -First 1
          Write-Host "Inspecting $($pyd.FullName)"
          $dumpbin = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
              & $dumpbin.FullName /dependents $pyd.FullName
          } else {
              Write-Host "dumpbin not found"
          }
      - name: Test Built Wheel
        run: |
          python3 -m pip install "pytest~=8.0"
          python3 -m pytest
        working-directory: bindings/python

  macos:
    runs-on: ${{ matrix.vm }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        include:
          - target: x86_64
            vm: macos-15-intel
          - target: aarch64
            vm: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64' && '-C link-arg=-Wl,-ld_classic' || '' }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: bindings/python/dist
      - name: Install Built Wheel
        run: python3 -m pip install -vv pyrudof --find-links=bindings/python/dist --no-index
      - name: Test Built Wheel
        run: |
          python3 -m pip install "pytest~=8.0"
          python3 -m pytest
        working-directory: bindings/python

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist
      - name: Install Built sdist
        run: python3 -m pip install -vv pyrudof --find-links=bindings/python/dist --no-index
      - name: Test Built sdist
        run: |
          python3 -m pip install "pytest~=8.0"
          python3 -m pytest
        working-directory: bindings/python

  release:
    name: Release
    if: github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [python-checks, linux, macos, windows, sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
      - name: List artifacts
        run: ls -lhs
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing *
