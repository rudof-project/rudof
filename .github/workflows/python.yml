name: Python

on:
  push:
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "**/LICENSE*"
      - "**/README*"
      - "**/CHANGELOG*"
      - "**/.dockerignore"
      - "**/Dockerfile*"
      - "**/*.md"
      - "**/*.nix"
      - .readthedocs.yml
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/**"
      - "**/LICENSE*"
      - "**/README*"
      - "**/CHANGELOG*"
      - "**/.dockerignore"
      - "**/Dockerfile*"
      - "**/*.md"
      - "**/*.nix"
      - .readthedocs.yml
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  linux:
    runs-on: ${{ matrix.vm }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ 3.12 ]
        target: [ x86_64, aarch64 ]
        include:
          - target: x86_64
            vm: ubuntu-latest
          - target: aarch64
            vm: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
#      - name: Fix openssl regression
#        run: cargo update openssl-src --precise 300.5.0+3.5.0
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          # `auto` picks manylinux2014 (CentOS 7), whose default toolchain
          # predates GCC 13. `lbug` (LadybugDB) ships prebuilt headers built
          # against GCC 13 and using C++23's <format>, which manylinux2014's
          # compiler can't parse ("fatal error: format: No such file or
          # directory"). manylinux_2_28 (AlmaLinux 8) would make
          # gcc-toolset-13 installable, but its default OpenSSL is 1.1.1,
          # which lacks `SSL_get1_peer_certificate` (added in OpenSSL 3.0)
          # that lbug's prebuilt library calls -- the resulting wheel links
          # fine (Linux allows unresolved symbols in a .so at link time) but
          # fails at import with "undefined symbol: SSL_get1_peer_certificate"
          # once loaded against a real 1.1.1 on the test runner. manylinux_2_34
          # (AlmaLinux 9) defaults to OpenSSL 3.x, matching what the
          # ubuntu-latest/ubuntu-24.04-arm runners used below have, so the
          # wheel's dynamic OpenSSL dependency resolves consistently.
          manylinux: "2_34"
          args: --release --out dist --interpreter ${{ matrix.python-version }}
          sccache: 'true'
          before-script-linux: |
            # If we're running on rhel/almalinux (manylinux containers), install needed packages.
            if command -v yum &> /dev/null; then
                yum update -y && yum install -y perl-core openssl openssl-devel pkgconfig libatomic

                # If we're running on i686 we need to symlink libatomic
                # in order to build openssl with -latomic flag.
                if [[ ! -d "/usr/lib64" ]]; then
                    ln -s /usr/lib/libatomic.so.1 /usr/lib/libatomic.so
                fi

                # lbug (LadybugDB) needs a C++23 <format>-capable compiler
                # (GCC 13+) to build its cxx FFI bridge; manylinux_2_34's
                # default GCC (11) is older, so pull in gcc-toolset-13 for
                # this build only. Best-effort: if the package isn't
                # available, fall through to the container's default compiler.
                if yum install -y gcc-toolset-13 2>/dev/null; then
                    source /opt/rh/gcc-toolset-13/enable
                    export CC=gcc
                    export CXX=g++
                fi
            else
                # If we're running on debian-based system.
                apt update -y && apt-get install -y --fix-missing libssl-dev openssl pkg-config
            fi
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: bindings/python/dist
      - name: Install Built Wheel
        run: python3 -m pip install -vv pyrudof --find-links=bindings/python/dist --no-index
      - name: Test Built Wheel
        run: cd bindings/python/tests && python3 -m unittest discover -vvv

  windows:
    runs-on: Windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: [ 3.12 ]
        target: [ x64 ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # `lbug` (LadybugDB) unconditionally links against OpenSSL
      # (`cargo:rustc-link-lib=dylib=ssl`/`crypto`) on every platform. The
      # Windows runner ships OpenSSL but the linker doesn't know where to
      # find it unless these point at it -- mirrors the equivalent step in
      # artifacts.yml's windows job (already needed there for the same
      # reason, since rudof_cli has depended on lbug since before this).
      - name: Point Cargo at the pre-installed OpenSSL
        run: |
          Get-Command openssl
          openssl version
          dir "C:\Program Files\OpenSSL\lib"
          echo "OPENSSL_LIB_DIR=C:/Program Files/OpenSSL/lib" >> $env:GITHUB_ENV
          echo "OPENSSL_DIR=C:/Program Files/OpenSSL/" >> $env:GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=C:/Program Files/OpenSSL/include" >> $env:GITHUB_ENV
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python-version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: bindings/python/dist
      - name: Install Built Wheel
        run: python3 -m pip install -vv pyrudof --find-links=bindings/python/dist --no-index
      - name: Test Built Wheel
        run: cd bindings/python/tests && python3 -m unittest discover -vvv

  macos:
    runs-on: ${{ matrix.vm }}
    # `lbug` (LadybugDB)'s cxx FFI bridge uses C++20's <format>, which Apple's
    # libc++ only makes available starting deployment target 13.3 (Ventura) --
    # below that, `<format>`'s contents are availability-gated out entirely.
    # maturin/rustc otherwise default x86_64 to 10.7/10.12 and arm64 to 11.0,
    # both too old. An explicit MACOSX_DEPLOYMENT_TARGET here overrides that
    # default (confirmed: maturin only computes one when none is set).
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    strategy:
      fail-fast: false
      matrix:
        python-version: [ 3.12 ]
        target: [x86_64, aarch64]
        include:
          - target: x86_64
            vm: macos-15-intel
          - target: aarch64
            vm: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ matrix.python-version }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: bindings/python/dist
      - name: Install Built Wheel
        run: python3 -m pip install -vv pyrudof --find-links=bindings/python/dist --no-index
      - name: Test Built Wheel
        run: cd bindings/python/tests && python3 -m unittest discover -vvv

