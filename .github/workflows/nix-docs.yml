name: Nix docs

on:
  push:
    branches:
      - master
    paths:
      - "nix/modules.nix"
      - "nix/docs.nix"
      - "nix/lib.nix"

jobs:
  regenerate:
    name: Regenerate Nix module options reference
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RUDOF_BOT_ID }}
          private-key: ${{ secrets.RUDOF_BOT_PK }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Generate Nix module options reference
        run: |
          out=$(nix build .#rudof-options-doc -L --no-link --print-out-paths)
          cp "$out" docs/src/references/nix-options.md
      - name: Commit and push if changed
        run: |
          git config user.name "rudof-bot[bot]"
          git config user.email "${{ secrets.RUDOF_BOT_ID }}+rudof-bot[bot]@users.noreply.github.com"

          if git diff --quiet -- docs/src/references/nix-options.md; then
            echo "Generated reference is unchanged"
            exit 0
          fi

          git add docs/src/references/nix-options.md
          git commit -m "docs(nix): regenerate module options reference"
          git push
