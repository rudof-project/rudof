[package]
name = "bench-shex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
shex_ast.workspace = true
shex_validation.workspace = true
rudof_rdf = { workspace = true, features = ["sparql"] }
rudof_iri.workspace = true
serde.workspace = true
toml.workspace = true
walkdir.workspace = true
anyhow.workspace = true
# `default-features = false` drops `zip`'s `zstd` feature only: its compiled
# zstd symbols clash at link time with the ones bundled in `lbug` (now a
# transitive dependency via rudof_lib, a dev-dependency here). The corpus
# archive this crate reads doesn't use zstd compression, so every other
# default codec (deflate/bzip2/lzma/xz/aes) stays enabled. Declared directly
# rather than via `zip.workspace = true`: Cargo won't let a member override
# `default-features` on an inherited workspace dependency.
zip = { version = "2", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate64",
    "deflate",
    "lzma",
    "time",
    "xz",
] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion.workspace = true
rudof_lib.workspace = true

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "compile"
harness = false

[[bench]]
name = "validator_init"
harness = false

[[bench]]
name = "validate"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "validate_precompiled"
harness = false
