[package]
name = "bench-issue730"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bench-issue730"
path = "src/main.rs"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rudof_lib.workspace = true
anyhow.workspace = true
# Declared directly rather than via `zip.workspace = true`: Cargo won't let a
# member override `default-features` on an inherited workspace dependency.
# `default-features = false` drops `zip`'s `zstd` feature only: its compiled
# zstd symbols clash at link time with the ones bundled in `lbug` (now a
# transitive dependency via rudof_lib). The corpus archive this benchmark
# reads doesn't use zstd compression, so every other default codec
# (deflate/bzip2/lzma/xz/aes) stays enabled.
zip = { version = "2", default-features = false, features = [
    "aes-crypto",
    "bzip2",
    "deflate64",
    "deflate",
    "lzma",
    "time",
    "xz",
] }
